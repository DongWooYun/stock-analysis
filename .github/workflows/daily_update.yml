name: Daily Stock Update

on:
  schedule:
    - cron: '0 0 * * 1-5'        # 평일 09:00 KST (파이프라인)
    - cron: '0 0,6,12,18 * * *'  # 6시간마다 (wake)
  workflow_dispatch:

# 기본 권한은 읽기 전용, 쓰기가 필요한 잡에만 개별 부여
permissions:
  contents: read

jobs:
  update-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.schedule == '0 0 * * 1-5' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    # 파이프라인이 겹쳐 실행되며 push 충돌나는 것 방지
    concurrency:
      group: pipeline-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            **/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests
          pip install git+https://github.com/FinanceData/FinanceDataReader.git

      - name: Run pipeline
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python pipeline.py

      - name: Commit and push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          git add streamlit_app/data/output/ data/output/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto update: $(date +'%Y-%m-%d')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

  wake-streamlit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.schedule == '0 0,6,12,18 * * *' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: wake-streamlit
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      # apt-key 제거(ubuntu-26.04)로 깨지던 수동 설치 스텝 대체
      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Wake Streamlit apps
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: python wake_app.py
